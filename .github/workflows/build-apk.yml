name: Build Android APK from ZIP
on:
  push:
    branches: [main]
    paths:
      - 'AI-Voice-Studio-Android-Source.zip'
      - '.github/workflows/build-apk.yml'
      - 'android-overlay/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project
        shell: bash
        run: |
          test -f AI-Voice-Studio-Android-Source.zip || { echo "Upload AI-Voice-Studio-Android-Source.zip to repository root first"; exit 1; }
          mkdir -p extracted
          unzip -q AI-Voice-Studio-Android-Source.zip -d extracted
          test -f extracted/AI-Voice-Studio/settings.gradle || { echo "Android project missing in ZIP"; exit 1; }
      - name: Apply Gemini Android upgrade
        shell: bash
        run: |
          cp android-overlay/app/src/main/java/com/example/aivoicestudio/MainActivity.java extracted/AI-Voice-Studio/app/src/main/java/com/example/aivoicestudio/MainActivity.java
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET" />|' extracted/AI-Voice-Studio/app/src/main/AndroidManifest.xml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo 'Android SDK not found on runner'; exit 1; }
          ls "$ANDROID_HOME/platforms" || true
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "sdkmanager not found"; find "$ANDROID_HOME" -name sdkmanager -type f; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: extracted/AI-Voice-Studio
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-debug-apk
          path: extracted/AI-Voice-Studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
